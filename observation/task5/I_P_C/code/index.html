<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Price Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h1>Product Price Calculator</h1>
    <div class="row">
      <label for="pname">Product Name</label>
      <input type="text" id="pname" placeholder="e.g. Laptop">
    </div>
    <div class="row">
      <label for="qty">Quantity</label>
      <input type="number" id="qty" value="1" min="1" step="1">
    </div>
    <div class="row">
      <label for="unitPrice">Price per unit (Rs.)</label>
      <input type="number" id="unitPrice" value="0" min="0" step="0.01">
    </div>
    <div class="result">
      <p id="summary">Product: 1 x Rs. 0.00</p>
      <p id="grandTotal">Total: Rs. 0.00</p>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html
